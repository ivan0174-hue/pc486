; pc486 - configurazione della macchina emulata
; I percorsi sono relativi alla cartella /pc486 della scheda SD.

[pc]
bios = ami486.bin          ; BIOS di sistema AMI 486 (ALi M1429)
vga_bios = s3virge.bin     ; BIOS della Diamond Stealth 3D 2000 (S3 ViRGE)
nvram = cmos.bin           ; CMOS/orologio (creato automaticamente)
mem_size = 16M             ; RAM: da 4M a 64M
vram_size = 4M             ; memoria video: 2M o 4M

; Dischi fissi IDE (hda = master primario, hdb = slave primario,
; hdc/hdd = canale secondario). Per un CD-ROM usare cda..cdd = file.iso
hda = freedos_hd.img
;hda = sd:2               ; oppure: partizione 2 della scheda SD come disco C:
;hdb = dati.img
;cdc = cdrom.iso

; Floppy (si possono cambiare dal menu Ctrl+Alt+F12)
;fda = freedos.img
;fdb = vtest.img

sound = 1                  ; Sound Blaster 16 (220h, IRQ 5, DMA 1/5) + AdLib
serial_mouse = 1           ; 1 = mouse seriale Microsoft su COM1, 0 = mouse PS/2
pci = 1                    ; bus PCI con la ViRGE e servizi PCI BIOS (0 = come la scheda originale)

[cpu]
gen = 4                    ; 4 = 486
fpu = 1                    ; coprocessore matematico
speed = 0                  ; 0 = massima velocita', altrimenti milioni di istruzioni al secondo
                           ; (40 = 486DX2-66, 20 = 486DX-33, 2 = 386SX-16). Ctrl+Alt+F11 = turbo

[display]
aspect = 4:3               ; 4:3 (bande nere su schermi 16:9) oppure stretch

[sound]
sound_out = both           ; both = HDMI e jack, pwm = solo jack 3.5 mm, hdmi = solo HDMI, none = muto
